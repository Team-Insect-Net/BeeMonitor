# BeeMonitor Optimized Configuration
# Version: 2.0 (Simplified)

# ==============================================================================
# NEST DETECTION - Multi-frame Consensus
# ==============================================================================
nest_detection:
  # Multi-frame consensus settings
  consensus:
    enabled: true
    n_frames: 10                  # Number of frames to sample
    spatial_tolerance: 8          # Distance threshold for same nest (pixels)
    min_confidence_ratio: 0.6     # Minimum detection rate to include nest
  
  # Adaptive threshold
  adaptive_threshold:
    enabled: true                 # Automatically adjust confidence
    target_count: 50              # Expected number of nests
    fallback_threshold: 0.9       # If adaptive fails
  
  # Grid structure
  grid:
    auto_detect: true             # Automatically detect grid structure
    expected_rows: null           # null = auto-detect, or set manually
    expected_cols: 10             # Expected columns per row (hint)
    fill_missing: true            # Fill in missing nest positions
  
  # Reference frame matching
  reference:
    use_reference: false          # Match to saved reference frame
    reference_name: null          # Name of reference (e.g., "hotel_A")
    create_reference: false       # Save current as reference
    reference_dir: "references"   # Directory for reference files
  
  # Nest dimensions (pixels)
  nest_size:
    width: 38
    height: 28
    padding_x: 5
    padding_y: 7
  
  # Hotel ROI padding
  hotel_padding:
    x: 100
    y: 50
  
  # Detection parameters (usually don't need to change)
  detection:
    confidence_threshold: 0.9     # Overridden by adaptive if enabled
    nest_class: 2                 # YOLO class ID for nest_hole
    frame_skip: 30                # Frames to skip between samples
    min_detections: 60            # Minimum detections before stopping

# ==============================================================================
# TRACKING - Simplified Parameters
# ==============================================================================
tracking:
  # RECOMMENDED: Use a preset
  preset: "balanced"              # Options: fast, balanced, accurate, high_density, low_activity
  
  # OR: Configure manually with simplified parameters
  manual_config:
    enabled: false                # Set to true to override preset
    
    # Core parameters (only 4 needed!)
    track_persistence: 30         # How long to remember tracks (frames)
    max_association_distance: 150 # Maximum distance for matching (pixels)
    detection_quality: "medium"   # low, medium, high
    motion_sensitivity: "medium"  # low, medium, high
  
  # Adaptive configuration
  adaptive:
    enabled: false                # Auto-adapt to video characteristics
    base_preset: "balanced"       # Starting point for adaptation

# ==============================================================================
# VIDEO PROCESSING
# ==============================================================================
video:
  resolution:
    width: 1280
    height: 720
  fps: 30

# ==============================================================================
# OUTPUT GENERATION
# ==============================================================================
output:
  base_folder: "output"
  
  # Visualization
  visualization:
    save_videos: false            # Save annotated tracking videos
    save_frames: false            # Save intermediate debug frames
  
  # CSV output
  csv:
    columns: ["timestamp", "nest", "action", "filename"]
  
  # Video synthesis
  video_synthesis:
    codec: "mp4v"
    fps: 30

# ==============================================================================
# ADVANCED OPTIONS (Usually don't need to change)
# ==============================================================================
advanced:
  # Nest detection
  nest_detection:
    clustering:
      row_eps: 15                 # DBSCAN epsilon for row clustering
      col_eps: 10                 # DBSCAN epsilon for column clustering
      min_samples: 3              # Minimum samples for cluster
    
    validation:
      min_nests_per_row: 5        # Minimum nests to consider valid row
      max_missing_per_row: 3      # Maximum gaps to fill per row
  
  # Tracking
  tracking:
    aspect_ratio:
      min: 0.5                    # Minimum width/height ratio
      max: 2.0                    # Maximum width/height ratio
    
    kalman_filter:
      enabled: false              # Use Kalman filter for prediction
      process_noise: 1.0
      measurement_noise: 1.0

# ==============================================================================
# LOGGING
# ==============================================================================
logging:
  level: "INFO"                   # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: false
  log_file: "beemonitor.log"

# ==============================================================================
# NOTES
# ==============================================================================
# 
# QUICK START:
# 1. For most cases, just use the default "balanced" preset
# 2. Enable adaptive_threshold for automatic confidence adjustment
# 3. Enable reference matching for consistent IDs across videos
#
# PRESETS:
# - fast: Quick processing, lower accuracy
# - balanced: Good balance of speed and accuracy (RECOMMENDED)
# - accurate: Best accuracy, slower processing
# - high_density: Optimized for many bees
# - low_activity: Optimized for infrequent activity
#
# MIGRATION FROM OLD CONFIG:
# Old configurations with 10+ parameters are automatically migrated
# to the new simplified 4-parameter system.